<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>封面设计助手</title>
  <link rel="stylesheet" href="/dsh-cover-studio/studio.css">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1118; }
    #dsh-cover-studio-fonts { display: none; }
    @font-face { font-family: "Cover Serif"; src: url("/dsh-cover-studio/fonts/serif") format("truetype"); font-weight: 900; font-display: swap; }
    @font-face { font-family: "Cover Serif"; src: url("/dsh-cover-studio/fonts/serif") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Cover Sans"; src: url("/dsh-cover-studio/fonts/sans") format("truetype"); font-weight: 400 700; font-display: swap; }
    :root {
      --dsw-alias-bg-base: #F7F7F5;
      --dsw-alias-bg-layer-1: #FFFFFF;
      --dsw-alias-bg-layer-2: #F0F0ED;
      --dsw-alias-bg-overlay: #FFFFFF;
      --dsw-alias-label-primary: #1A1D22;
      --dsw-alias-label-secondary: #5C6269;
      --dsw-alias-label-tertiary: #7A8088;
      --dsw-alias-border-l1: rgba(0,0,0,.10);
      --dsw-alias-border-l2: rgba(0,0,0,.16);
      --dsw-alias-brand-primary: #0169CC;
      --dsw-alias-state-error-primary: #C9312B;
      --dsw-alias-state-warn-primary: #A66A18;
    }
  </style>
</head>

  <script>window.__COVER_STUDIO_STANDALONE__ = true;</script>
